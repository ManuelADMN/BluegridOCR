services:
  backend:
    build:
      context: ./Deploy/backend_api
      dockerfile: Dockerfile
    container_name: bluegridocr_backend_https
    restart: unless-stopped
    env_file:
      - ./Deploy/backend_api/.env
    environment:
      ENVIRONMENT: "production"
      HOST: "0.0.0.0"
      PORT: "8000"
      HTTPS_ENABLED: "false"
      TRUST_PROXY_HEADERS: "true"
      STORAGE_ROOT: "/data"
    volumes:
      - ${IMAGES_HOST_DIR:-./data}:/data
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./Front
      dockerfile: Dockerfile
    container_name: bluegridocr_frontend_https
    restart: unless-stopped
    environment:
      API_BASE_URL: ""
      ENABLE_INTERNAL_API_PROXY: "false"
    volumes:
      - ./Front/nginx.https.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs/prod:/etc/nginx/certs:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
