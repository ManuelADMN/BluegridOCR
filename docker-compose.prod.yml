services:
  backend:
    build:
      context: ./Producto/CodigoFuente/Deploy/backend_api
      dockerfile: Dockerfile
    image: bluegridocr-backend:local
    container_name: bluegridocr_backend_prod
    restart: unless-stopped
    environment:
      ENVIRONMENT: ${ENVIRONMENT:-production}
      APP_TIMEZONE: ${APP_TIMEZONE:-America/Santiago}
      HOST: 0.0.0.0
      PORT: 8000
      HTTPS_ENABLED: ${HTTPS_ENABLED:-false}
      DATABASE_URL: ${DATABASE_URL:-}
      SUPABASE_KEY: ${SUPABASE_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-not-configured}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5}
      ANTHROPIC_OCR_AUDIT_MODEL: ${ANTHROPIC_OCR_AUDIT_MODEL:-claude-sonnet-5}
      OCR_MODE: ${OCR_MODE:-segmented}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-not-configured}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      TRUST_PROXY_HEADERS: "true"
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:3001,http://127.0.0.1:3001}
      # Almacenamiento de imágenes en disco (reemplazo de Blob Storage).
      STORAGE_ROOT: ${STORAGE_ROOT:-/data}
    volumes:
      # Bind mount: las imágenes persisten en la EC2 y sobreviven a rebuild/--force-recreate.
      # Crear en la EC2:  mkdir -p /opt/bluegridocr/data
      - ${IMAGES_HOST_DIR:-/opt/bluegridocr/data}:/data
    ports:
      # Opción B: el backend NO se expone a internet. El frontend lo alcanza por la red
      # interna de Docker (host "backend"). Se publica solo en 127.0.0.1 para depurar en la
      # propia EC2 (curl http://localhost:8000/...). Para exponerlo de nuevo: "${BACKEND_PORT:-8000}:8000".
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend:
    build:
      context: ./Producto/CodigoFuente/Front
      dockerfile: Dockerfile
    image: bluegridocr-frontend:local
    container_name: bluegridocr_frontend_prod
    restart: unless-stopped
    environment:
      # Opción B (proxy interno): nginx activa nginx.azure.conf y reenvía /api/ al
      # contenedor backend por la red interna de Docker. El navegador llama same-origin
      # (/api/v1/...), por eso API_BASE_URL queda vacío. No expone 8000 ni usa CORS.
      ENABLE_INTERNAL_API_PROXY: "${ENABLE_INTERNAL_API_PROXY:-true}"
      API_BASE_URL: "${API_BASE_URL-}"
    ports:
      # Publicado en el puerto 80 del host: la app queda en http://<host> sin ":3000".
      # (Requiere abrir el puerto 80/TCP en el Security Group de la EC2.)
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
