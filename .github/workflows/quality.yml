name: Quality checks

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Producto/CodigoFuente/Deploy/backend_api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: |
            Producto/CodigoFuente/Deploy/backend_api/requirements.txt
            Producto/CodigoFuente/Deploy/backend_api/requirements-dev.txt
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt pip-audit==2.10.1
      - run: python -m pip check
      - run: python -m pip_audit -r requirements.txt
      - run: python -m pytest -q --cov --cov-report=term-missing --cov-fail-under=45

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Producto/CodigoFuente/Front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: npm
          cache-dependency-path: Producto/CodigoFuente/Front/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.https.yml config --quiet
      - run: docker compose -f Producto/CodigoFuente/docker-compose.prod.yml config --quiet
      - run: docker compose -f Producto/CodigoFuente/docker-compose.https.yml config --quiet
